<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for fading ends (Orange-500 base) -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" />
      <stop offset="15%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffedd5" stop-opacity="1" /> <!-- Bright center -->
      <stop offset="85%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" />
      <stop offset="15%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffedd5" stop-opacity="1" />
      <stop offset="85%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- X Shape -->
  <g filter="url(#glow)">
    <!-- Line 1 (\) - Tapered shape -->
    <path d="M 100 100 L 245 255 L 400 400 L 255 245 Z" fill="url(#grad1)" />
    
    <!-- Line 2 (/) - Tapered shape -->
    <path d="M 400 100 L 255 255 L 100 400 L 245 245 Z" fill="url(#grad2)" />
  </g>
</svg>